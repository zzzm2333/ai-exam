<title>人工智能训练师题库</title>
<style>

.ain{max-width:658px;margin:0 auto;display:flex;gap:9px;align-items:center}
.bt{border-radius:99px;padding:13px 20px;font-weight:650;font-size:14.5px;transition:transform .15s;white-space:nowrap}

.toast{position:fixed;left:50%;bottom:120px;transform:translateX(-50%);background:var(--tx);color:var(--bg);font-size:13px;font-weight:600;padding:10px 18px;border-radius:99px;z-index:99;animation:up .25s;white-space:nowrap}
.ta{width:100%;min-height:132px;border:1.5px solid var(--bd);border-radius:13px;background:var(--card);color:var(--tx);font-size:14px;line-height:1.7;padding:12px 14px;font-family:inherit;resize:vertical;outline:none;transition:border-color .15s}
.ta:focus{border-color:var(--blue)}

.code{background:var(--fill);border:1px solid var(--bd);border-radius:13px;padding:13px 14px;margin-top:11px;font-family:ui-monospace,"SF Mono",Menlo,Consolas,"Courier New",monospace;font-size:12.5px;line-height:1.7;overflow-x:auto;-webkit-overflow-scrolling:touch}
.fl{white-space:pre-wrap;word-break:break-all;min-height:1.6em}
.fbi{display:inline-block;vertical-align:middle;height:28px;border:none;border-bottom:2px solid var(--blue);background:var(--bluebg);color:var(--tx);border-radius:7px 7px 0 0;padding:0 7px;font-family:inherit;font-size:12.5px;line-height:26px;outline:none;text-align:center;min-width:4.5ch;max-width:100%;box-sizing:border-box}
.fbi:focus{background:var(--card);box-shadow:0 0 0 2px var(--bluebg)}

.fno{flex:none;font-size:12px;font-weight:700;color:var(--blue);background:var(--bluebg);border-radius:8px;padding:5px 9px}

.fbi2{flex:1;min-width:170px;height:40px;border:1.5px solid var(--bd);border-radius:11px;background:var(--card);color:var(--tx);font-family:ui-monospace,Menlo,Consolas,"Courier New",monospace;font-size:13px;padding:0 12px;outline:none;transition:border-color .15s}
.fbi2:focus{border-color:var(--blue)}
.fbi2.ok{border-color:var(--green);background:var(--greenbg)}

.abtns{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.abtns .bt{padding:9px 18px;font-size:13px}

.frr.no{background:var(--redbg);color:var(--red)}

@media(max-width:820px){.ta,.fbi,.fbi2{font-size:16px}.fbi{height:32px;line-height:30px}.fbi2{height:44px}.code{font-size:11.5px;padding:11px}}
</style>

<div id="app"></div>
<script>
/* ===== 二级客观题题库数据（依据《广东省人工智能训练师二级（技师）题库最终冻结版》第一部分） ===== */
const SQ2=`人工智能训练师在项目交付中的首要职业操守是|按时交付并隐藏不利测试记录|如实报告测试结果与风险|优先满足领导个人意见|用口头承诺代替测试报告|1|如实报告是诚信底线，隐藏记录属造假。
处理含个人信息的数据时，训练师应首先确认|数据量是否足够大|处理目的、授权范围与来源合法性|服务器是否够用|标注工具是否顺手|1|合规先于效率，先确认授权与合法性。
对训练数据的敏感字段（如身份证号）应|直接保留以便复现|脱敏并按最小必要原则使用|加密后仍全量入训练集|复制多份分散保存|1|最小必要＋脱敏＋留痕，不因复现牺牲合规。
发现模型在部分场景误报率异常升高，正确做法是|调低置信度阈值掩盖|记录问题并组织复测、归因|删除异常场景的样本|推迟交付且不说明原因|1|暴露问题并闭环，不以掩盖或删样代替归因。
使用开源模型权重建设商用系统时，应|直接使用不查许可|阅读许可证并核查商用、分发义务|标注作者后即可任意再分发|一律视为无限制|1|许可决定使用边界，须逐条核查。
NumPy中计算二维数组每列均值应使用|np.mean(a, axis=0)|np.mean(a, axis=1)|a.mean(axis=2)|np.average(a.T)|0|axis=0为列方向。
Pandas中去除完全重复行的方法是|df.fillna()|df.drop_duplicates()|df.dropna()|df.replace()|1|drop_duplicates去重行。
将字符串列转为统一格式的正确做法是|直接覆盖原列|用map/replace统一映射并保留原值|删除异常值|忽略不处理|1|口径转换应可追溯，保留原值与映射规则。
监督学习中“训练误差低但验证误差高”通常表示|欠拟合|过拟合|数据泄露|正常收敛|1|训练误差低、验证误差高是过拟合典型表现。
梯度下降中学习率过大可能导致的后果是|训练更稳定|损失震荡甚至发散|必然收敛更快|与学习率无关|1|学习率过大越过最优点导致震荡。
多模态数据一般指|多张同规格图片|文本、图像、音频、表格等异构数据|多个数据库|多个模型|1|多模态指异构数据类型的融合建模。
《中华人民共和国数据安全法》确立的核心原则之一是|数据自由流通优先|数据分类分级保护|数据默认公开|处理无需授权|1|分类分级是数据安全法核心制度。
《中华人民共和国个人信息保护法》中“告知—同意”原则要求|只要内部使用可免告知|处理前告知目的方式并取得同意|同意后信息可永久使用|书面同意必须纸质|1|处理个人信息以告知同意为前提。
用于标注的图片数据集，其版权风险主要来自|图片分辨率|来源授权与再分发许可|图片大小|标注工具版本|1|版权风险在授权与使用边界。
模型过拟合时，增大训练数据量最直接的作用是|必然提升训练精度|提升泛化能力、缓解过拟合|加速收敛|减少参数量|1|更多真实样本提升泛化。
从“人工客服工作量大”挖掘智能改造场景，第一步应|直接采购大模型|拆解咨询量、耗时、重复度、差错与投诉|扩大客服团队|提高考核指标|1|先量化业务现状再定位可改造环节。
设计跨部门数据架构时，泳道图的主要作用是|美化文档|明确各部门责任与交接边界|替代数据库设计|简化流程|1|泳道表达业务责任与交接。
某智能审核模块通过率提高但投诉增加，应优先|下调阈值继续提通过率|核查是否把转人工减少误当效果提升|删除投诉样本|停止上线|1|先区分“真效果”与“指标虚高”。

/* ===== 基础工具 ===== */
const $=s=>document.querySelector(s);
const AB=['A','B','C','D'];
const esc=s=>String(s).replace(/</g,'&lt;');
const store={g:(k,d)=>{try{const v=JSON.parse(localStorage.getItem(k));return v==null?d:v}catch(e){return d}},s:(k,v)=>localStorage.setItem(k,JSON.stringify(v))};
const SEC2=[['职业道德','⚖️',1,5,101,102,141,143],['基础知识','📖',6,15,103,106,144,149],['业务分析','📊',16,35,107,114,150,161],['智能训练','🎯',36,60,115,124,162,176],['智能系统设计','🛠️',61,95,125,138,177,197],['培训与指导','🎓',96,100,139,140,198,200]];
let W,ST,HIST,S,SU,DONE,RV,tmr;

function getQ(id){
 const t=id[0],i=+id.slice(1);
 if(t=='s'){const a=SQ[i].split('|');return{id,type:'单选',no:i+1,text:a[0],opts:[a[1],a[2],a[3],a[4]],ans:[+a[5]],exp:a[6]||''}}
 if(t=='m'){const a=MQ[i].split('|');return{id,type:'多选',no:CNT.s+1+i,text:a[0],opts:[a[1],a[2],a[3],a[4]],ans:a[5].split('').map(Number),exp:a[6]||'',multi:1}}
 const a=JQ[i].split('|');return{id,type:'判断',no:CNT.s+CNT.m+1+i,text:a[0],opts:['正确','错误'],ans:[+a[1]],exp:a[2]||'',judge:1};
}
function secOf(q){for(const s of SEC){if(q.type=='单选'&&q.no>=s[2]&&q.no<=s[3])return s[0];if(q.type=='多选'&&q.no>=s[4]&&q.no<=s[5])return s[0];if(q.type=='判断'&&q.no>=s[6]&&q.no<=s[7])return s[0]}return ''}
function idsFor(r){
 const o=[],push=(t,a,b)=>{for(let n=a;n<=b;n++)o.push(t+(n-1))};
 if(r=='all'){push('s',1,CNT.s);push('m',CNT.s+1,CNT.s+CNT.m);push('j',CNT.s+CNT.m+1,CNT.s+CNT.m+CNT.j)}
 else if(r=='s')push('s',1,CNT.s);
 else if(r=='m')push('m',CNT.s+1,CNT.s+CNT.m);
 else if(r=='j')push('j',CNT.s+CNT.m+1,CNT.s+CNT.m+CNT.j);
 else{const s=SEC[+r[1]];push('s',s[2],s[3]);push('m',s[4],s[5]);push('j',s[6],s[7])}
 return o;
}
function shuf(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a}
function fmtT(s){return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),1800)}
function ansStr(q,arr){if(!arr||!arr.length)return '未作答';return q.judge?(arr[0]==0?'正确':'错误'):arr.slice().sort().map(i=>AB[i]).join('')}

/* ===== 模式设置 ===== */
function setup(m){SU={m,rid:'all',cnt:-1,rnd:m=='e'?1:0};drawSetup()}
function drawSetup(){
 const m=SU.m,wl=Object.keys(W).length;
 const rgs=[['all','全部题库',CNT.s+CNT.m+CNT.j],['s','单选题',CNT.s],['m','多选题',CNT.m],['j','判断题',CNT.j]].concat(SEC.map((s,i)=>['c'+i,s[0],s[3]-s[2]+1+s[5]-s[4]+1+s[7]-s[6]+1]));
 if(m=='p')rgs.push(['wrong','错题本',wl]);
 const chips=rgs.map(r=>`<button class="ch ${SU.rid==r[0]?'on':''}" ${r[0]=='wrong'&&!wl?'disabled style="opacity:.4"':''} onclick="SU.rid='${r[0]}';drawSetup()"><b>${r[1]}</b><span>${r[2]} 题</span></button>`).join('');
 const cnt=m=='e'?`<div class="tip">题量（从所选范围抽取）</div><div class="seg">${[-1,100,50,20].map(c=>`<button class="${SU.cnt==c?'on':''}" onclick="SU.cnt=${c};drawSetup()">${c<0?'全部':c+' 题'}</button>`).join('')}</div>`:'';
 const ord=`<div class="tip">出题顺序</div><div class="seg"><button class="${SU.rnd?'on':''}" onclick="SU.rnd=1;drawSetup()">随机</button><button class="${SU.rnd?'':'on'}" onclick="SU.rnd=0;drawSetup()">按题号</button></div>`;
 $('#app').innerHTML=`<div class="top"><div class="tin"><button class="nv" onclick="home()">‹</button><div class="tb">${m=='p'?'刷题模式':'考试模式'}</div><span style="width:36px"></span></div></div>
 <div class="wrap"><div class="tip" style="margin-top:20px">选择出题范围</div><div class="chips">${chips}</div>${cnt}${ord}
 <button class="bt bp" style="width:100%;margin-top:22px;padding:15px" onclick="start('${m}',SU.rid,SU.cnt,SU.rnd)">开始${m=='p'?'刷题':'考试'}</button></div>`;
 document.body.className='';window.scrollTo(0,0);
}

/* ===== 开始 / 继续 ===== */
function start(m,rid,cnt,rnd){
 let ids=rid=='wrong'?Object.keys(W):idsFor(rid);
 if(!ids.length)return toast('该范围暂无题目');
 if(rnd)ids=shuf(ids);
 if(m=='e'&&cnt>0&&cnt<ids.length)ids=ids.slice(0,cnt);
 S={m,rid,cnt,rnd,pos:0,ids,ans:{},done:{},t0:Date.now()};
 store.s(pkey('s'),S);quiz();
}
function resume(){S=store.g(pkey('s'),null);if(!S||S.fin)return home();quiz()}

/* ===== 答题页 ===== */
function optHtml(q,sel,locked){
 const rows=q.opts.map((o,i)=>{
  let cls='o';
  if(locked){if(q.ans.includes(i))cls+=' right';else if(sel.includes(i))cls+=' wrong';cls+=' lock'}
  else if(sel.includes(i))cls+=' on';
  return `<div class="${cls}" onclick="pick(${i})"><div class="lb">${AB[i]}</div><div style="flex:1">${esc(o)}</div></div>`}).join('');
 return `<div class="os" id="opts">${rows}</div>`;
}
function verdictHtml(q,sel,ok,id){
 let h=`<div class="vd ${ok?'ok':'no'}">${ok?'✓ 回答正确':'✗ 回答错误'} · 正确答案 ${ansStr(q,q.ans)}${ok?'':' · 已记入错题本'}</div>`;
 if(q.exp)h+=`<div class="ex"><span class="lab">解析</span> ${esc(q.exp)}</div>`;
 if(S.rid=='wrong'&&W[id])h+=`<button class="rm" onclick="rmWC('${id}')">已掌握 · 移出错题本 ✓</button>`;
 return h;
}
function quiz(){
 clearInterval(tmr);
 const id=S.ids[S.pos],q=getQ(id),sel=S.ans[id]||[],locked=S.m=='p'&&!!S.done[id],last=S.pos==S.ids.length-1;
 const doneN=S.m=='p'?Object.keys(S.done).length:S.ids.filter(x=>(S.ans[x]||[]).length).length;
 const prog=Math.round(doneN/S.ids.length*100);
 const right=S.m=='e'?`<span class="tm" id="tm">${fmtT((Date.now()-S.t0)/1000|0)}</span><button class="nv" style="font-size:12.5px;font-weight:700;width:auto;padding:0 8px" onclick="sheet(1)">答题卡</button>`:'<span style="width:76px"></span>';
 let btns='';
 if(S.pos>0)btns+=`<button class="bt bf" onclick="prev()">‹ 上一题</button>`;
 if(S.m=='p')btns+=locked?`<button class="bt bp" onclick="next()">${last?'完成 ✓':'下一题 ›'}</button>`:`<button class="bt bp" id="cf" ${sel.length?'':'disabled'} onclick="confirmAns()">确认答案</button>`;
 else btns+=`<button class="bt bp" onclick="next()">${last?'交卷 ✓':'下一题 ›'}</button>`;
 const tip=q.multi&&!locked?`<div class="tip" style="margin:-4px 0 12px">多选题 · 请选出所有正确选项（多选少选不得分）</div>`:'';
 const vd=locked?verdictHtml(q,sel,S.done[id]==1,id):'';
 document.body.className='pad';
 $('#app').innerHTML=`<div class="top"><div class="tin"><button class="nv" onclick="quit()">‹</button><div class="tb">${S.m=='p'?'刷题':'考试'} · ${S.pos+1}/${S.ids.length}</div>${right}</div><div class="pb" style="height:3px;border-radius:0"><i style="width:${prog}%"></i></div></div>
 <div class="wrap"><div class="qc">
  <div class="qh"><span class="tg ${q.type=='单选'?'b':q.type=='多选'?'p':'t'}">${q.type}题</span><span class="tg g">${secOf(q)}</span><span class="qn">第 ${q.no} 题</span></div>
  <div class="qt">${esc(q.text)}</div>${tip}${optHtml(q,sel,locked)}${vd}
 </div></div>
 <div class="ab"><div class="ain">${btns}</div></div>`;
 if(S.m=='e')tmr=setInterval(()=>{const e=$('#tm');if(e)e.textContent=fmtT((Date.now()-S.t0)/1000|0)},1000);
 window.scrollTo(0,0);
}
function pick(i){
 const id=S.ids[S.pos],q=getQ(id);
 if(S.m=='p'&&S.done[id])return;
 let sel=S.ans[id]||[];
 sel=q.multi?(sel.includes(i)?sel.filter(x=>x!=i):sel.concat(i)):[i];
 S.ans[id]=sel;store.s(pkey('s'),S);
 $('#opts').outerHTML=optHtml(q,sel,false);
 const b=$('#cf');if(b)b.disabled=!sel.length;
}
function confirmAns(){
 const id=S.ids[S.pos],q=getQ(id),sel=S.ans[id]||[];
 if(!sel.length)return toast('请先选择答案');
 const ok=sel.length==q.ans.length&&q.ans.every(a=>sel.includes(a));
 S.done[id]=ok?1:2;ST.a++;if(ok)ST.c++;
 if(!ok)W[id]={c:(W[id]?W[id].c:0)+1,t:Date.now()};
 store.s(pkey('s'),S);store.s(pkey('w'),W);store.s(pkey('st'),ST);quiz();
}
function prev(){if(S.pos>0){S.pos--;store.s(pkey('s'),S);quiz()}}
function next(){
 if(S.pos<S.ids.length-1){S.pos++;store.s(pkey('s'),S);quiz()}
 else if(S.m=='e')sheet(1);
 else finishP();
}

/* ===== 答题卡 / 交卷 ===== */
function sheet(open){
 const o=$('#ovl');if(!open){if(o)o.remove();return}
 if(o)return;
 const cells=S.ids.map((id,i)=>{const a=(S.ans[id]||[]).length>0;return `<button class="gi ${a?'a':''} ${i==S.pos?'cur':''}" onclick="S.pos=${i};store.s(pkey('s'),S);sheet(0);quiz()">${getQ(id).no}</button>`}).join('');
 const d=document.createElement('div');d.id='ovl';d.className='mask';
 d.innerHTML=`<div class="sheet" onclick="event.stopPropagation()"><div class="sh-h"><b>答题卡</b><button class="nv" style="font-size:15px" onclick="sheet(0)">✕</button></div><div class="grid">${cells}</div><button class="bt bgr" onclick="submit()">交卷（已答 ${S.ids.filter(id=>(S.ans[id]||[]).length).length}/${S.ids.length}）</button></div>`;
 d.onclick=()=>sheet(0);document.body.appendChild(d);
}
function submit(){
 const blank=S.ids.filter(id=>!(S.ans[id]||[]).length).length;
 if(blank>0&&!confirm(`还有 ${blank} 题未作答，确定交卷吗？`))return;
 clearInterval(tmr);sheet(0);
 let r=0,b=0;const mod={s:[0,0],m:[0,0],j:[0,0]};
 for(const id of S.ids){
  const q=getQ(id),sel=S.ans[id]||[];
  const ok=sel.length==q.ans.length&&q.ans.every(a=>sel.includes(a));
  if(ok)r++;else if(!sel.length)b++;
  mod[id[0]][0]+=ok?1:0;mod[id[0]][1]++;
  if(sel.length&&!ok)W[id]={c:(W[id]?W[id].c:0)+1,t:Date.now()};
  ST.a++;if(ok)ST.c++;
 }
 const secs=(Date.now()-S.t0)/1000|0;
 S.res={r,b,secs,mod};S.fin=1;
 store.s(pkey('s'),S);store.s(pkey('w'),W);store.s(pkey('st'),ST);
 HIST.push({p:Math.round(r/S.ids.length*100),r,b,n:S.ids.length,t:fmtT(secs),d:new Date().toLocaleDateString('zh-CN')});
 HIST=HIST.slice(-10);store.s(pkey('h'),HIST);
 result();
}

function rvItem(id){
 const q=getQ(id),sel=S.ans[id]||[];

 return `<div class="qc" style="margin-top:10px;animation:none">
  <div class="qh"><span class="tg ${ok?'ok':'no'}">${ok?'✓ 正确':'✗ 错误'}</span><span class="tg g">第${q.no}题 · ${q.type}题</span></div>

}
function rvList(t){const it=S.ids.filter(id=>id[0]==t).map(id=>rvItem(id)).join('');return it||'<div class="empty">该模块无题目</div>'}
function result(){
 document.body.className='';
 const R=S.res,tot=S.ids.length,p=Math.round(R.r/tot*100),w=tot-R.r-R.b;
 const segs=[['s','单选题'],['m','多选题'],['j','判断题']].filter(m=>R.mod[m[0]][1]>0);
 if(!segs.find(m=>m[0]==RV))RV=segs[0][0];
 const ring=`<svg viewBox="0 0 140 140"><circle cx="70" cy="70" r="60" fill="none" stroke="var(--fill)" stroke-width="10"/><circle cx="70" cy="70" r="60" fill="none" stroke="${p>=60?'var(--green)':'var(--red)'}" stroke-width="10" stroke-linecap="round" stroke-dasharray="377" stroke-dashoffset="${(377*(1-p/100)).toFixed(1)}" transform="rotate(-90 70 70)"/></svg>`;
 $('#app').innerHTML=`<div class="top"><div class="tin"><button class="nv" onclick="home()">‹</button><div class="tb">考试成绩</div><span style="width:36px"></span></div></div>
 <div class="wrap">
  <div class="card rc"><div class="rw">${ring}<div class="rt"><b>${p}</b><span>得分 / 100</span></div></div>
   <div class="rs"><div><b style="color:var(--green)">${R.r}</b><span>正确</span></div><div><b style="color:var(--red)">${w}</b><span>错误</span></div><div><b>${R.b}</b><span>未答</span></div><div><b>${fmtT(R.secs)}</b><span>用时</span></div></div></div>
  <div class="card"><h3>模块正确率</h3>${segs.map(m=>`<div class="mod"><span>${m[1]}</span><div class="pb"><i style="width:${Math.round(R.mod[m[0]][0]/R.mod[m[0]][1]*100)}%"></i></div><em>${R.mod[m[0]][0]}/${R.mod[m[0]][1]}</em></div>`).join('')}</div>
  <div class="card"><h3>答案解析（错题已自动记入错题本）</h3><div class="seg">${segs.map(m=>`<button class="${RV==m[0]?'on':''}" onclick="RV='${m[0]}';result()">${m[1]}</button>`).join('')}</div><div style="margin-top:6px">${rvList(RV)}</div></div>
  <div style="display:flex;gap:9px;margin:16px 0 34px;flex-wrap:wrap">
   <button class="bt bf" onclick="home()">返回首页</button>
   <button class="bt bf" onclick="start('e',S.rid,S.cnt,S.rnd)">再考一组</button>
   ${Object.keys(W).length?`<button class="bt bp" onclick="start('p','wrong',0,1)">刷错题（${Object.keys(W).length}）</button>`:''}
  </div></div>`;
 window.scrollTo(0,0);
}

let MST,SUB;
const PRACT2=[
{n:'第二部分 · 主观题专项',d:'简答题24题＋论述题6题，对应技能考核与综合评审的方案设计能力。建议先自行写出得分点，再展开参考答案对照。考场规则：先写编号得分点，解析仅供理解；先覆盖动作、依据、指标和闭环，再补细节；题目未给定的比例、阈值、周期等只能作为建议值，须说明依据并通过验证确定。',data:`#简答题 · 职业道德、法律与基础（第1—4题）
1. 项目负责人要求删除不利测试记录后上线，你作为二级人工智能训练师应如何处置？|①暂停删除并完整保存原始日志、版本和审批记录；②如实说明风险，不伪造或选择性报告；③复测并分析失败样本对安全、合规和业务的影响；④按变更流程提交评审，未达准入条件不上线；⑤确需例外时由授权责任人审批，保留整改期限和回退方案。【解析】二级人员不仅要“拒绝造假”，还要组织复测、评审和风险闭环。
2. 将含客户联系方式的售后对话用于训练，应建立怎样的合规处理闭环？|①确认处理目的、授权范围和数据来源合法性；②按最小必要原则提取字段，删除或脱敏联系方式等标识；③设置访问权限、加密存储和留存期限；④在采集、标注、导出环节记录处理日志并抽检残留敏感信息；⑤到期删除，发现泄露或越权立即隔离、上报和整改。
3. 为什么训练任务必须保留数据版本、代码版本、参数和随机种子？说明其与实验复现的关系。|①数据版本固定样本、标签及划分清单；②代码版本固定模型和预处理逻辑；③参数文件记录学习率、轮数、批次等配置；④随机种子控制划分、增强和初始化等随机过程；⑤共同保存环境与权重，才能复现结果、比较单次改动效果并追溯线上问题。【解析】固定随机种子不保证跨硬件完全逐位一致，因此还需记录运行环境。
4. 使用公开图片和开源模型建设商用训练集时，应核查哪些知识产权与使用边界？|①核查图片许可、授权范围和是否允许商用及再分发；②确认人物、商标等权利及必要授权；③阅读模型、权重、代码和数据的许可证及义务；④保留来源、作者、许可证和修改记录；⑤按许可证要求署名、保留声明或开放衍生成果；⑥权利不清的素材不进入交付数据集。
#简答题 · 业务分析（第5—8题）
5. 如何从“人工客服工作量大”进一步挖掘值得智能化改造的业务场景？|①按咨询类型拆解量、耗时、重复度、差错和投诉；②绘制从进线到结案流程，定位等待和重复录入环节；③识别规则稳定、数据可得的标准任务作为候选；④评估风险、数据质量、系统接口和人工成本；⑤用基线与小范围试点比较解决率、时长和满意度，再决定扩展。
6. 设计跨部门业务数据架构时，如何避免只画技术流程而遗漏业务责任？|①以业务目标和端到端价值流为主轴；②用泳道标明业务、数据、算法、运维及审批责任人；③为每个节点定义输入、输出、字段口径和时限；④标出系统接口、人工判断及异常回路；⑤设置质量责任和交付验收人；⑥用真实案例走查并确认跨部门交接。
7. 数据采集、处理、审核三个流程如何通过质量规则形成闭环？|①采集端定义来源、字段、格式、授权和质量规则；②处理端执行去重、缺失处理、口径转换并保留原值；③审核端自动校验加人工抽检，记录问题类型；④不合格数据隔离，退回责任节点修正后重审；⑤规则命中率、返工率入监控，定期修订规则并版本化。
8. 某智能审核模块上线后通过率提高但投诉增加，应如何定位并优化该业务模块？|①按渠道、类别、人员和时段比较通过率、差错率与投诉；②核查是否把转人工减少误当效果提升；③抽查投诉关联样本，区分规则错误、界面误导和接口异常；④回看发布前后数据及阈值变更；⑤先对高风险分支降级或转人工；⑥经回放和小流量验证后再恢复。
#简答题 · 智能训练（第9—14题）
9. 高质量训练集与“数量很多的图片集合”有何本质区别？|①样本代表真实场景并覆盖关键类别、环境和困难情况；②标签有规范、复核及一致性证据；③来源合法且元数据完整可追溯；④无重复、损坏、泄露和显著偏差；⑤类别与场景分布有统计报告；⑥能依据错误分析持续补采、修订并管理版本。
10. 黄金测试集应如何建设和维护，才能支撑模型版本比较？|①依据业务风险定义覆盖矩阵，纳入典型、边界和对抗样本；②标签经专家复核，争议样本仲裁；③独立封存，不参与训练和调参；④保存划分清单与哈希指纹，防止篡改；⑤保留稳定核心集，另设反映新场景的扩展集；⑥变更须审批并记录版本差异。
11. 一份可执行的模型测试方案至少应包含哪些内容？|①明确对象、版本、业务目标与风险范围；②列出数据来源、规模、标签和独立性证明；③设计总体、分类别、分场景及边界测试；④给出指标公式、统计口径和题目给定的准入条件；⑤规定环境、工具、步骤和复现方式；⑥约定缺陷分级、报告、复测与审批。
12. 同一用户的相邻对话被随机分到训练集和测试集，会产生什么问题？如何纠正？|①相邻对话语义高度相似，模型可能记住用户表达；②测试集信息提前进入训练，形成组级泄漏；③离线指标虚高，换用户后性能下降；④应按user_id或会话组整体划分；⑤划分前近重复去重，划分后检查组、文本指纹交集；⑥重训并在独立用户上验证。【解析】随机打乱不能消除同源样本之间的泄漏。
13. 面对误分类样本，如何避免“见错就加数据”的低效优化？|①按真实标签、预测、置信度、场景和来源归类；②区分标签错误、样本缺覆盖、类间相似、预处理或模型问题；③用混淆矩阵和代表性样本确认主因；④分别采取修标、定向补采、特征或参数优化；⑤只改一个主要因素做对照；⑥在旧回归集和新场景集验证收益与副作用。
14. 训练集损失下降、验证集损失上升时，应怎样设计下一轮训练实验？|①先核查数据划分、标签及预处理是否异常；②保存学习曲线、配置和当前权重作为基线；③选择合适轮次早停，避免继续过拟合；④采用与任务相容的增强、正则化或权重衰减；⑤用验证集做单因素对照并记录日志；⑥测试集仅最终评估，回归检查各类别是否受损。
#简答题 · 智能系统设计（第15—20题）
15. 为同一业务领域设计多个智能产品时，如何避免形成相互割裂的“烟囱系统”？|①先画共同业务价值流和各产品职责边界；②统一主数据、标签口径、身份权限与接口规范；③复用数据治理、模型服务、检索和监控能力；④通过事件或消息衔接产品，避免重复采集和相互覆盖；⑤明确跨产品异常责任人；⑥以端到端业务指标而非单产品指标验收。
16. 智能产品需求说明书中，怎样把“回答要准确”改写为可验收的需求？|①限定知识范围、问题类型和用户角色；②定义正确、无依据回答和引用可核验的标准；③建立专家标注测试集及题目给定验收口径；④分别统计答案正确率、检索命中和引用有效率；⑤规定无答案时拒答或转人工；⑥记录版本、响应和回归结果，形成验收报告。【解析】不能把“准确率很高”作为没有数据集与统计口径的验收条件。
17. RAG系统回答错误时，应如何区分检索故障与生成故障？|①固定问题并打印检索片段、来源和相似度；②原文存在但未召回，检查解析、切片、索引、查询改写和过滤条件；③片段已召回但答案错，检查提示词、上下文截断和生成约束；④引用错查文档版本及元数据；⑤分别构造检索集与生成用例回归。
18. 人机协同流程中的硬性转人工与弹性转人工有何区别？|①硬性规则针对安全、合规、权限等不可由模型决定的事项，命中即转人工；②弹性规则依据置信度、信息完整度和连续失败等风险信号综合判断；③两者都需写明责任人、上下文交接和时限；④人工结果回流规则评估；⑤用回放校准覆盖率与漏转风险。
19. 多智能产品全链路上线前，为什么必须做历史回放和异常演练？|①历史回放可在不影响真实用户的情况下比较新旧方案；②能量化自动处理、转人工、时长、差错和成本；③跨产品链路可暴露字段、状态及接口衔接问题；④异常演练验证超时、无结果、权限失败和回退；⑤问题修复后须重放，审批通过方可灰度。

function normFill(s){
 s=String(s==null?'':s).trim().replace(/[；;。,，\s]+$/,'');
 s=s.replace(/^['"`]+|['"`]+$/g,'').replace(/\s+/g,'').toLowerCase();
 return s.replace(/\(\)$/,'');
}
function segStd(a){
 const pos=[];
 for(let i=0;i<CNUM.length;i++){const idx=a.indexOf(CNUM[i]);if(idx>=0)pos.push({i,idx})}
 const out={};
 pos.forEach((p,pi)=>{
  const end=pi+1<pos.length?pos[pi+1].idx:a.length;
  let seg=a.slice(p.idx+1,end).trim();
  const cut=seg.search(/[。；;]/);
  if(cut>=0)seg=seg.slice(0,cut);
  const acc=new Set();
  const par=seg.indexOf('（');
  const prim=(par>=0?seg.slice(0,par):seg).trim();
  if(prim)acc.add(prim);
  if(par>=0){
   acc.add(seg.replace(/（/g,'(').replace(/）/g,')'));
   const am=seg.match(/（或([^）]*)）/);
   if(am)acc.add(am[1].trim());
  }
  out[p.i]=[...acc];
 });
 return out;
}

const _rawGet  = store.g;

/* ---- 通用请求：自动带 token，401 自动刷新一次 ---- */
async function sbFetch(path, opt={}, retry=true){
  const headers = Object.assign({
    'apikey': SB_KEY,
    'Content-Type': 'application/json'
  }, opt.headers||{});
  if (TOKEN) headers['Authorization'] = 'Bearer ' + TOKEN;
  const r = await fetch(SB_URL + path, Object.assign({}, opt, {headers}));
  if (r.status === 401 && retry && REFRESH){
    const ok = await refreshToken();
    if (ok) return sbFetch(path, opt, false);
  }
  return r;
}

async function refreshToken(){
  try {
    const r = await fetch(SB_URL + '/auth/v1/token?grant_type=refresh_token', {
      method: 'POST',
      headers: {'Content-Type':'application/json','apikey':SB_KEY},
      body: JSON.stringify({refresh_token: REFRESH})
    });
    if (!r.ok) return false;
    const d = await r.json();
    TOKEN = d.access_token; REFRESH = d.refresh_token; UID = d.user.id;
    EMAIL = d.user.email || EMAIL;
    localStorage.setItem('tk_token', TOKEN);
    localStorage.setItem('tk_refresh', REFRESH);
    localStorage.setItem('tk_cur_user', UID);
    localStorage.setItem('tk_email', EMAIL);
    return true;
  } catch(e){ return false; }
}

async function sbSignup(email, pass){
  const r = await fetch(SB_URL + '/auth/v1/signup', {
    method:'POST',
    headers:{'Content-Type':'application/json','apikey':SB_KEY},
    body: JSON.stringify({email, password: pass})
  });
  const d = await r.json();
  if (!r.ok) throw new Error(d.msg || d.error_description || '注册失败');
  return d;
}

async function sbLogin(email, pass){
  const r = await fetch(SB_URL + '/auth/v1/token?grant_type=password', {
    method:'POST',
    headers:{'Content-Type':'application/json','apikey':SB_KEY},
    body: JSON.stringify({email, password: pass})
  });
  const d = await r.json();
  if (!r.ok) throw new Error(d.error_description || d.msg || '登录失败');
  return d;
}

/* ---- meta：每个 key 的本地最后修改时间 ---- */
function getMeta(){ return _rawGet('tk_meta_' + (UID||'guest'), {}); }
function setMeta(m){ _rawSave('tk_meta_' + (UID||'guest'), m); }
function touchMeta(k){
  const m = getMeta();
  m[k] = Date.now();
  setMeta(m);
}

/* ---- 包装 store.s：写本地后打标记并防抖同步 ---- */
let syncTimer = null;
store.s = function(k, v){
  _rawSave(k, v);
  if (TOKEN && !k.startsWith('tk_meta_')){
    touchMeta(k);
    scheduleSync();
  }
};
function scheduleSync(){
  if (!TOKEN) return;
  clearTimeout(syncTimer);
  syncTimer = setTimeout(pushAll, 1500);
}

/* ---- 会话合并：按题 id 合并 ans / done ---- */
function mergeSession(a, b){
  if (!a) return b;
  if (!b) return a;
  if (!a.ids || !b.ids) return ((a.t0||0) >= (b.t0||0)) ? a : b;
  const base = ((a.t0||0) >= (b.t0||0)) ? a : b;
  return Object.assign({}, base, {
    ans:  Object.assign({}, b.ans  || {}, a.ans  || {}),
    done: Object.assign({}, b.done || {}, a.done || {})
  });
}

/* ---- 推送全部本地改动到云端 ---- */
async function pushAll(){
  if (!TOKEN) return;
  const m = getMeta();
  const rows = [];
  for (const k of Object.keys(m)){
    if (k.startsWith('tk_meta_')) continue;
    const v = _rawGet(k, null);
    if (v === null) continue;
    rows.push({
      level: k.startsWith('tk3_') ? '3' : '2',
      key: k,
      value: v,
      updated_at: new Date(m[k]).toISOString()
    });
  }
  if (!rows.length) return;
  try {
    await sbFetch('/rest/v1/progress', {
      method: 'POST',
      headers: {'Prefer': 'resolution=merge-duplicates,return=minimal'},
      body: JSON.stringify(rows)
    });
  } catch(e){}
}

/* ---- 从云端拉取并合并到本地 ---- */
async function pullAll(){
  if (!TOKEN) return;
  let rows = [];
  try {
    const r = await sbFetch('/rest/v1/progress?select=level,key,value,updated_at');
    if (!r.ok) return;
    rows = await r.json();
  } catch(e){ return; }
  const m = getMeta();
  let changed = false;
  for (const row of rows){
    const cloudT = new Date(row.updated_at).getTime();
    const localT = m[row.key] || 0;
    if (cloudT > localT){
      if (row.key.endsWith('_s')){
        const local = _rawGet(row.key, null);
        _rawSave(row.key, mergeSession(local, row.value));
      } else {
        _rawSave(row.key, row.value);
      }
      m[row.key] = cloudT;
      changed = true;
    }
  }
  if (changed) setMeta(m);
}

/* ---- 删除云端某个 key（用于刷题完成后清理会话） ---- */
async function deleteCloudKey(key){
  try {
    await sbFetch('/rest/v1/progress?key=eq.' + encodeURIComponent(key), {method:'DELETE'});
  } catch(e){}
}

/* ---- 旧数据迁移：tk_xxx -> tk_{UID}_xxx ---- */
function migrateOldData(){
  if (!UID) return;
  const flagKey = 'tk_mig_to_' + UID;
  if (localStorage.getItem(flagKey)) return;
  const names = ['w','st','h','s','mst','ans','fill'];
  const m = getMeta();
  for (const p of ['tk_', 'tk3_']){
    for (const n of names){
      const oldK = p + n;
      const newK = p + UID + '_' + n;
      const oldV = localStorage.getItem(oldK);
      if (oldV !== null && localStorage.getItem(newK) === null){
        localStorage.setItem(newK, oldV);
        m[newK] = Date.now();
      }
    }
  }
  setMeta(m);
  localStorage.setItem(flagKey, '1');
}

/* ---- 页面切走 / 关闭时尽量 flush ---- */
document.addEventListener('visibilitychange', ()=>{
  if (document.visibilityState === 'hidden') flushSync();
});
window.addEventListener('beforeunload', ()=>flushSync(true));

function flushSync(){
  if (!TOKEN) return;
  clearTimeout(syncTimer);
  const m = getMeta();
  const rows = [];
  for (const k of Object.keys(m)){
    if (k.startsWith('tk_meta_')) continue;
    const v = _rawGet(k, null);
    if (v === null) continue;
    rows.push({
      level: k.startsWith('tk3_') ? '3' : '2',
      key: k,
      value: v,
      updated_at: new Date(m[k]).toISOString()
    });
  }
  if (!rows.length) return;
  try {
    fetch(SB_URL + '/rest/v1/progress', {
      method: 'POST',
      keepalive: true,
      headers: {
        'apikey': SB_KEY,
        'Authorization': 'Bearer ' + TOKEN,
        'Content-Type': 'application/json',
        'Prefer': 'resolution=merge-duplicates,return=minimal'
      },
      body: JSON.stringify(rows)
    });
  } catch(e){}
}

/* ---- 登录 / 注册 / 退出 ---- */
async function onAuthSuccess(d){
  TOKEN = d.access_token; REFRESH = d.refresh_token; UID = d.user.id;
  EMAIL = d.user.email || '';
  localStorage.setItem('tk_token', TOKEN);
  localStorage.setItem('tk_refresh', REFRESH);
  localStorage.setItem('tk_cur_user', UID);
  localStorage.setItem('tk_email', EMAIL);
  migrateOldData();
  await pullAll();
  setLevel(LV);
  scheduleSync();
  home();
}

async function doLoginClick(){
  const email = $('#lgEmail').value.trim();
  const pass = $('#lgPass').value;
  if (!email || !pass) return toast('请输入邮箱和密码');
  const btn = $('#lgBtn'); btn.disabled = true; btn.textContent = '登录中…';
  try {
    const d = await sbLogin(email, pass);
    await onAuthSuccess(d);
    toast('登录成功');
  } catch(e){
    toast(e.message || '登录失败');
    btn.disabled = false; btn.textContent = '登录';
  }
}

async function doRegisterClick(){
  const email = $('#rgEmail').value.trim();
  const pass = $('#rgPass').value;
  const pass2 = $('#rgPass2').value;
  if (!email || !pass) return toast('请填写邮箱和密码');
  if (pass.length < 6) return toast('密码至少 6 位');
  if (pass !== pass2) return toast('两次密码不一致');
  try {
    const d = await sbSignup(email, pass);
    if (d.access_token){
      await onAuthSuccess(d);
      toast('注册并登录成功');
    } else {
      toast('注册成功，请查收邮箱确认');
      loginPage();
    }
  } catch(e){ toast(e.message || '注册失败'); }
}

function logout(){

  TOKEN=''; REFRESH=''; UID=''; EMAIL='';
  localStorage.removeItem('tk_token');
  localStorage.removeItem('tk_refresh');
  localStorage.removeItem('tk_cur_user');
  localStorage.removeItem('tk_email');
  clearInterval(tmr);
  setLevel(LV);
  loginPage();
}
